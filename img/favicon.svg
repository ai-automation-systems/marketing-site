<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- на 16px тонкая рамка пропадает, поэтому здесь залитый вариант знака -->
  <mask id="favCut">
    <rect width="44" height="44" fill="#ffffff"/>
    <text x="22" y="22.6" font-family="Manrope, Helvetica, Arial, sans-serif" font-weight="800"
      font-size="17.5" textLength="28" lengthAdjust="spacingAndGlyphs" text-anchor="middle"
      dominant-baseline="central" fill="#000000">СРБ</text>
  </mask>
  <rect width="44" height="44" rx="3" fill="#ffffff" mask="url(#favCut)"/>
</svg>
